jobs:
  build:
    runs-on: ubuntu-latest  # 租用一台 GitHub 提供的最新版 Ubuntu Linux 雲端虛擬機

    steps:
    # 步驟一：把你的專案程式碼下載到這台雲端虛擬機裡
    - name: Checkout repository
      uses: actions/checkout@v4

    # 步驟二：安裝並設定 Docker 打包工具（Buildx）
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 步驟三：開始執行 Build！
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile  # 去找你專案根目錄下的 Dockerfile 檔案
        push: false         # 只是測試，先不上傳（不 push 到 ACR），只在雲端跑看會不會成功
